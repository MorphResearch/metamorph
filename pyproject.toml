[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metamorph-agent"
version = "0.1.0"
description = "A measurable, sandboxed self-improving agent harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0.0"]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.30.0"]
tools = ["ddgs>=5.0.0", "pypdf>=4.0.0", "python-docx>=1.1.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
metamorph = "main:main"

[tool.setuptools.packages.find]
include = ["llm*", "graphs*", "state*", "tools*", "prompts*", "api*", "api.v1*",
           "config*", "memory*", "multiagent*", "adapters*"]
exclude = ["tests*", "scilink-agent*", "docs*", "workspace*"]

[tool.setuptools.package-data]
api = ["frontend/*", "frontend/**/*"]
