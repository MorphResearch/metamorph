<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metamorph · AI Agent</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo">◈</span>
        <div>
          <h1>Metamorph</h1>
          <p class="tagline">AI Agent 工作台</p>
        </div>
      </div>

      <button id="new-chat" class="new-chat">+ 新建对话</button>

      <div class="history-head">历史运行</div>
      <ul id="history-list" class="history-list">
        <li class="empty">暂无运行记录</li>
      </ul>

      <div class="sidebar-foot">
        <span id="conn-pill" class="pill pill-off">连接中…</span>
        <span id="provider-pill" class="pill pill-info">—</span>
      </div>
    </aside>

    <main class="chat">
      <div id="messages" class="messages">
        <div class="welcome">
          <div class="welcome-logo">◈</div>
          <h2>我能帮你做什么？</h2>
          <p>描述一个任务，Agent 会规划、调用工具并执行，最后给出结果。你可以随时查看它的思考与执行过程。</p>
          <div class="suggestions">
            <button class="chip" data-q="检查当前工作区并总结文件结构">检查当前工作区并总结文件结构</button>
            <button class="chip" data-q="用 Python 写一个快速排序，并加测试用例">用 Python 写一个快速排序，并加测试用例</button>
            <button class="chip" data-q="读取 README.md 并用一句话概括这个项目">读取 README.md 并用一句话概括这个项目</button>
          </div>
        </div>
      </div>

      <div class="composer">
        <div class="composer-row">
          <input id="workspace-input" class="workspace-input" type="text" value="default" title="工作区标识" />
          <label class="ws-label" for="workspace-input">工作区</label>
        </div>
        <div class="composer-row main-row">
          <textarea id="prompt-input" rows="1" placeholder="给 Agent 一个任务，回车发送（Shift+Enter 换行）…"></textarea>
          <button id="send-btn" title="发送">发送</button>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
